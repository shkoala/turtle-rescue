<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103d3c">
  <meta name="description" content="An illustrated English adventure for A2–A2+ learners. Travel with Mia and Leo from Pebble Bay to Turtle Beach.">
  <link rel="icon" type="image/webp" href="./assets/mark.webp">
  <link rel="preload" href="./assets/turtle.webp" as="image">
  <link rel="stylesheet" href="./styles.css?v=beach-journey-2">
  <title>Turtle Rescue | An English quest</title>
</head>
<body>
  <a class="skip" href="#main">Skip to the quest</a>
  <header class="masthead">
    <button class="brand" type="button" data-action="home" aria-label="Turtle Rescue home">
      <img src="./assets/mark.webp" width="38" height="38" alt="">
      <span>Turtle Rescue</span>
    </button>
    <div class="tools">
      <button class="utility" type="button" data-action="notice">Notice</button>
      <button class="utility" type="button" data-action="teacher">Teacher key</button>
      <button class="utility" type="button" data-action="motion" aria-pressed="false">Pause motion</button>
    </div>
  </header>
  <nav class="trail" id="route" aria-label="Quest progress"></nav>
  <main id="main" tabindex="-1"></main>
  <dialog id="teacher-key" aria-labelledby="teacher-title" class="help-dialog">
    <form method="dialog" class="dialog-header">
      <h2 id="teacher-title">Teacher key</h2>
      <button type="submit" class="secondary">Close</button>
    </form>
    <div id="teacher-content"></div>
  </dialog>
  <dialog id="notice" aria-labelledby="notice-title" class="help-dialog">
    <form method="dialog" class="dialog-header">
      <h2 id="notice-title">Volunteer notice</h2>
      <button type="submit" class="secondary">Close</button>
    </form>
    <div id="notice-content"></div>
  </dialog>
  <noscript><p class="no-script">Turn on JavaScript to play Turtle Rescue.</p></noscript>
  <script type="module" src="./game.js?v=beach-journey"></script>
</body>
</html>
